name: Analyse silencieuse
run-name: Analyse ${{ inputs.demande }}

# Une analyse par demande, chacune sur sa machine (quatre à la fois au plus, voir essai/aiguillage.py).
# Le code est ici ; les demandes et les résultats vivent dans un dépôt privé, récupéré à côté avec une clé
# gardée en secret (JETON). Rien de ce dépôt privé n'est écrit ici, ni dans les journaux : seuls y passent
# des titres, des durées et des accords.
on:
  workflow_dispatch:
    inputs:
      demande:
        description: "Fichier de la demande à traiter (dans demandes/ du dépôt des données)"
        required: true

permissions:
  contents: read
  actions: write       # pour relancer l'aiguillage à la fin, et allumer la relance des demandes en attente

concurrency:
  group: demande-${{ inputs.demande }}
  cancel-in-progress: false      # deux analyses de la même demande ne tournent jamais ensemble

env:
  DONNEES: ${{ github.workspace }}/donnees
  GH_REPO: ${{ github.repository }}

jobs:
  silencieux:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Données
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPOT_DONNEES || 'romaingaudet-maker/partitions-' }}
          token: ${{ secrets.JETON }}
          ref: main
          path: donnees

      # Avant toute installation : une ébauche tirée des paroles publiées et des grilles en ligne, en quelques secondes
      # (ebauche.py n'a besoin d'aucun module). Les étapes suivantes la remplacent.
      - name: Ébauche
        env:
          PUBLIER: "1"
          DEMANDE: ${{ inputs.demande }}
        run: |
          mkdir -p "$DONNEES/resultats" "$RUNNER_TEMP/journaux"
          timeout 90 python3 -u code/essai/ebauche.py 2>&1 | tee "$RUNNER_TEMP/journaux/journal-ebauche.txt" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/essai/requirements.txt

      - name: Cache des modèles
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: modeles-v2

      # Pendant que les outils d'analyse s'installent, le service lit la vidéo : dès qu'il a répondu,
      # une esquisse de la partition est publiée (silencieux.py n'a besoin d'aucun module).
      - name: Son, lectures du service et esquisse
        env:
          PUBLIER: "1"
          DEMANDE: ${{ inputs.demande }}
        run: |
          mkdir -p "$DONNEES/resultats" "$DONNEES/audio" "$RUNNER_TEMP/journaux"
          {
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1 torchvision==0.20.1
            pip install -r code/essai/requirements.txt
            pip list | grep -i -E "torch|demucs|beat|librosa|numpy|onnx|separator|scipy"
            nproc; free -g | head -2
          } > "$RUNNER_TEMP/journaux/journal-installation.txt" 2>&1 &
          installation=$!
          python -u code/essai/silencieux.py 2>&1 | tee "$RUNNER_TEMP/journaux/journal-silencieux.txt" || true
          if ls "$DONNEES/audio" | grep -v -e LISEZMOI -e origine.json | grep -q .; then
            wait $installation || { tail -40 "$RUNNER_TEMP/journaux/journal-installation.txt"; exit 1; }
          else
            # aucun son récupéré : inutile d'attendre la fin de l'installation
            pkill -P $installation 2>/dev/null || true; kill $installation 2>/dev/null || true
          fi

      # La partition est livrée par étapes : grille, première page, puis partition complète.
      - name: Analyse
        env:
          PUBLIER: "1"
        run: |
          if ls "$DONNEES/audio" | grep -v -e LISEZMOI -e origine.json | grep -q .; then
            python -u code/essai/analyse.py 2>&1 | tee "$RUNNER_TEMP/journaux/journal-analyse.txt"
          else
            echo "Aucun son récupéré : rien à analyser."
          fi

      # Chaque analyse n'enregistre que ce qui lui appartient (voir publier.py) : aucune ne gêne les autres.
      - name: Enregistrer les résultats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attente=""; [ -f "$DONNEES/demandes/.attente" ] && attente=1
          python code/essai/publier.py "Résultats de l'analyse (${{ github.run_number }})" --fin --journaux "$RUNNER_TEMP/journaux" || true
          # une demande refusée pour une raison passagère reste en place et sera retentée toutes les 15 minutes
          if [ -n "$attente" ]; then gh workflow enable relance.yml || echo "La relance automatique n'a pas pu être activée."; fi
          # une place se libère : l'aiguillage lance la demande suivante s'il y en a
          gh workflow run aiguillage.yml --ref main || true
