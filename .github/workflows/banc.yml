name: Banc d'essai des postes

# Mesure séparément chaque poste de l'analyse sur des enregistrements libres annotés à la main :
# « temps » (pulsations, GTZAN), « paroles » (placement des mots, JamendoLyrics), « reference » (annotations
# d'accords des titres de référence). Lancé à la main ; les résultats (des nombres) vont dans le dépôt des données.
on:
  workflow_dispatch:
    inputs:
      poste:
        description: "temps, paroles ou reference"
        required: true
        default: "temps"
      taille:
        description: "Nombre d'extraits par genre (temps) ou de titres par langue (paroles)"
        required: false
        default: "4"

run-name: Banc d'essai ${{ inputs.poste }}

permissions:
  contents: read

concurrency:
  group: banc-${{ inputs.poste }}
  cancel-in-progress: false

env:
  DONNEES: ${{ github.workspace }}/donnees

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Données
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPOT_DONNEES || 'romaingaudet-maker/partitions-' }}
          token: ${{ secrets.JETON }}
          ref: main
          path: donnees
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/essai/requirements.txt
      - uses: denoland/setup-deno@v2
        if: inputs.poste == 'reference'
      - name: Cache des modèles
        if: inputs.poste != 'reference'
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: modeles-v2
      - name: Installation
        run: |
          if [ "${{ inputs.poste }}" = "reference" ]; then pip install -q "yt-dlp[default]" mir_eval; else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1 torchvision==0.20.1
            pip install -q -r code/essai/requirements.txt mir_eval
          fi
      - name: Banc d'essai
        run: |
          mkdir -p "$DONNEES/resultats/banc"
          case "${{ inputs.poste }}" in
            temps) python -u code/outils/banc_temps.py "${{ inputs.taille }}" 2>&1 | tee "$DONNEES/resultats/banc/journal-temps.txt" ;;
            paroles) python -u code/outils/banc_paroles.py "${{ inputs.taille }}" 2>&1 | grep -v -i "warn" | tee "$DONNEES/resultats/banc/journal-paroles.txt" ;;
            reference) python -u code/outils/banc_reference.py 2>&1 | tee "$DONNEES/resultats/banc/journal-reference.txt" ;;
          esac
      - name: Enregistrer
        if: always()
        working-directory: donnees
        run: |
          git config user.name "essai-partitions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/b" && cp -r resultats/banc/poste-*.json resultats/banc/journal-${{ inputs.poste }}.txt resultats/banc/reference "$RUNNER_TEMP/b/" 2>/dev/null || true
          for essai in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            mkdir -p resultats/banc && cp -r "$RUNNER_TEMP"/b/* resultats/banc/ 2>/dev/null || true
            git add resultats/banc
            git commit -q -m "Banc d'essai : ${{ inputs.poste }}" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
